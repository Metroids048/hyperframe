name: Editing verification
on:
  push:
    branches: [agent/continue-editing-optimization]
  pull_request:
    paths:
      - 'video-agent/**'
      - '.github/workflows/editing-verification.yml'
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned runtime (legacy Windows dependencies tolerated during migration)
        working-directory: video-agent
        run: npm ci --force --no-audit --no-fund
      - name: Bundle runtime and tracked test inputs
        run: |
          mkdir -p verification-bundle
          tar -czf verification-bundle/node-runtime.tar.gz -C video-agent node_modules
          git archive --format=tar.gz HEAD > verification-bundle/tracked-project.tar.gz
          git rev-parse HEAD > verification-bundle/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: editing-runtime-${{ github.sha }}
          path: verification-bundle/
          if-no-files-found: error
          retention-days: 1
