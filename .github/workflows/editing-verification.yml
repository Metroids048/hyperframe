name: Materialize and verify editing continuation
on:
  push:
    branches: [agent/continue-editing-optimization]
permissions:
  contents: read
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      verified_sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the exact locally tested patch and apply application files only
        shell: python
        run: |
          import base64, hashlib, lzma, os, pathlib, subprocess
          parts = sorted(pathlib.Path('.github/continuation').glob('part-*.b64'))
          blob = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          expected = 'fe042a27485cfe6713669a227f0e40383657e85aed82227e5737620dbe66479d'
          assert hashlib.sha256(blob).hexdigest() == expected, 'Patch checksum mismatch; refusing to apply'
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'verified-editing.patch'
          patch.write_bytes(lzma.decompress(blob))
          subprocess.run(['git', 'apply', '--check', '--index', '--exclude=.github/workflows/*', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', '--exclude=.github/workflows/*', str(patch)], check=True)
          subprocess.run(['git', 'rm', '-r', '.github/continuation'], check=True)
      - name: Install verification media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify clean installation and core regressions
        working-directory: video-agent
        run: |
          npm ci --no-audit --no-fund
          node scripts/verify-editor.mjs core
      - name: Publish verified source to the isolated branch only
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "fix: continue conversational editing with verified local execution and portable media"
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git -c http.https://github.com/.extraheader="$header" push origin HEAD:refs/heads/agent/continue-editing-optimization
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: materialization-core-evidence
          path: video-agent/outputs/upgrade/verification/**
          retention-days: 7
  verify:
    needs: materialize
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.materialize.outputs.verified_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux media tools and Chinese glyph coverage
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install pinned dependencies
        working-directory: video-agent
        run: npm ci --no-audit --no-fund
      - name: Core regressions
        working-directory: video-agent
        run: node scripts/verify-editor.mjs core
      - name: Real browser, FFmpeg and HyperFrames acceptance
        working-directory: video-agent
        run: node scripts/verify-editor.mjs browser
      - name: Retain reports and rendered evidence, not fonts or user projects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editing-evidence-${{ matrix.os }}
          retention-days: 7
          path: |
            video-agent/outputs/upgrade/verification/**
            video-agent/outputs/upgrade/**/result.json
            video-agent/outputs/upgrade/ui/**/*.png
            video-agent/outputs/upgrade/conversation-media/**/report.json
            video-agent/outputs/upgrade/conversation-media/**/failure.json
            video-agent/outputs/upgrade/conversation-media/**/server.log
            video-agent/outputs/upgrade/conversation-media/**/desktop.png
            video-agent/outputs/upgrade/conversation-media/**/mobile.png
            video-agent/outputs/upgrade/conversation-media/**/conversation-result.mp4
