name: Commerce native pipeline

on:
  push:
    branches: [main]
    paths:
      - 'video-agent/lib/creative/**'
      - 'video-agent/scripts/commerce-agent*.mjs'
      - 'video-agent/scripts/test-commerce-native.mjs'
      - 'video-agent/examples/commerce/**'
      - 'video-agent/package.json'
      - 'video-agent/lib/edit/skills.mjs'
      - 'video-agent/config/skills/commerce-promo.md'
      - 'video-agent/scripts/test-skill-routing.mjs'
      - '.github/workflows/commerce-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: video-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: video-agent/package-lock.json
      - run: npm ci
      - run: npm run test:commerce
      - run: node scripts/test-skill-routing.mjs
      - name: Host-agent create and continued edit
        run: node scripts/test-commerce-agent-tool.mjs
      - run: npm run commerce:build
      - name: HyperFrames structure check
        run: |
          cd data/commerce-runs/coffee-demo
          node ../../../node_modules/hyperframes/bin/hyperframes.mjs check
      - name: Verify native image output
        run: |
          test -f data/commerce-runs/coffee-demo/index.html
          test -f data/commerce-runs/coffee-demo/document.json
          grep -q '<img' data/commerce-runs/coffee-demo/index.html
          ! grep -q 'hero.mp4' data/commerce-runs/coffee-demo/index.html
      - name: Render real 30-second vertical MP4
        run: |
          printf '%s' '{"action":"render","outputDir":"data/commerce-runs/coffee-demo","quality":"standard","video":"commerce-final.mp4"}' | node scripts/commerce-agent-tool.mjs
          test -s data/commerce-runs/coffee-demo/commerce-final.mp4
          ffprobe -v error -show_entries stream=width,height -show_entries format=duration -of json data/commerce-runs/coffee-demo/commerce-final.mp4 > data/commerce-runs/coffee-demo/ffprobe.json
          node -e "const r=require('fs').readFileSync('data/commerce-runs/coffee-demo/ffprobe.json','utf8');const j=JSON.parse(r);if(Math.abs(Number(j.format.duration)-30)>.15)process.exit(2);const v=j.streams.find(x=>x.width);if(v.width!==1080||v.height!==1920)process.exit(3);"
      - name: Upload rendered and editable evidence
        uses: actions/upload-artifact@v4
        with:
          name: commerce-native-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            video-agent/data/commerce-runs/coffee-demo/commerce-final.mp4
            video-agent/data/commerce-runs/coffee-demo/document.json
            video-agent/data/commerce-runs/coffee-demo/object-map.json
            video-agent/data/commerce-runs/coffee-demo/manifest.json
            video-agent/data/commerce-runs/coffee-demo/DESIGN.md
            video-agent/data/commerce-runs/coffee-demo/check.log
            video-agent/data/commerce-runs/coffee-demo/render.log
            video-agent/data/commerce-runs/coffee-demo/ffprobe.json
            video-agent/data/commerce-runs/tool-ci/revisions/*.json
