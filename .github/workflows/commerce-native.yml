name: Commerce native pipeline

on:
  push:
    branches: [main]
    paths:
      - 'video-agent/lib/creative/**'
      - 'video-agent/scripts/commerce-agent*.mjs'
      - 'video-agent/scripts/test-commerce-native.mjs'
      - 'video-agent/examples/commerce/**'
      - 'video-agent/package.json'
      - 'video-agent/lib/edit/skills.mjs'
      - 'video-agent/config/skills/commerce-promo.md'
      - 'video-agent/scripts/test-skill-routing.mjs'
      - '.github/workflows/commerce-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: video-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: video-agent/package-lock.json
      - run: npm ci
      - run: npm run test:commerce
      - run: node scripts/test-skill-routing.mjs
      - run: npm run commerce:build
      - name: HyperFrames structure check
        run: |
          cd data/commerce-runs/coffee-demo
          node ../../../node_modules/hyperframes/bin/hyperframes.mjs check
      - name: Verify native image output
        run: |
          test -f data/commerce-runs/coffee-demo/index.html
          test -f data/commerce-runs/coffee-demo/document.json
          grep -q '<img' data/commerce-runs/coffee-demo/index.html
          ! grep -q 'hero.mp4' data/commerce-runs/coffee-demo/index.html
