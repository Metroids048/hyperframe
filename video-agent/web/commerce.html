<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电商商品视频 · 对话制作</title><link rel="stylesheet" href="/commerce.css"></head><body><header><a href="/create">商品短视频制作助手</a><span>HyperFrames Commerce Studio</span></header><main><section class="chat"><h1>把商品图变成可用的宣传短视频</h1><p class="muted">上传商品图片，用一句话描述风格；随后继续对话修改字幕、动效和转场。</p><div id="messages" class="messages"><div class="bubble assistant">你好！上传 1–12 张商品图，然后告诉我想突出什么。</div></div><form id="create"><label class="drop">选择或拖入商品图片<input id="images" name="images" type="file" accept="image/png,image/jpeg,image/webp" multiple></label><div id="thumbs"></div><input name="productName" placeholder="商品名称（可选）"><div class="row"><input name="price" placeholder="价格，如 ¥99（可选）"><input name="cta" placeholder="结尾 CTA，如 立即购买（可选）"></div><input name="facts" placeholder="卖点，用逗号分隔（可选）"><textarea name="message" rows="3" placeholder="例如：做一条 15 秒竖屏高级感视频，突出瓶身细节，加入大标题和闪白转场"></textarea><div class="row"><select name="style"><option value="premium">高级质感</option><option value="promotion">促销醒目</option><option value="functional">功能说明</option></select><label class="duration">时长 <input name="duration" type="number" min="5" max="60" value="15"> 秒</label><button id="send" type="submit">生成宣传视频</button></div><p id="error" class="error" hidden></p></form><form id="follow" hidden><input name="message" placeholder="继续修改，例如：把价格放大一点，第三幕加闪白转场"><button type="submit">发送修改</button></form></section><section class="preview"><div id="empty"><h2>成片预览</h2><p class="muted">生成后这里会播放完整连续的视频。</p></div><video id="video" controls playsinline hidden></video><a id="download" class="download" hidden>下载 MP4</a><details id="details" hidden><summary>查看工程状态</summary><pre id="status"></pre></details></section></main><script type="module" src="/commerce.js"></script></body></html>
