<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1280,height=720">
<script src="assets/gsap.min.js"></script>
<style>@font-face{font-family:"Microsoft YaHei";src:local("Microsoft YaHei");font-weight:100 900;}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1280px;height:720px;overflow:hidden;background:#F5EBDD;color:#492918;font-family:'Microsoft YaHei',sans-serif}
.scene{position:absolute;inset:0;width:1280px;height:720px;overflow:hidden;background:#F5EBDD}.scene-content{width:100%;height:100%;padding:52px 64px;display:flex;flex-direction:column;gap:22px;position:relative}.top{display:flex;justify-content:space-between;align-items:center;z-index:2}.brand{font-family:Georgia,serif;font-size:35px;letter-spacing:2px}.label{font-size:17px;letter-spacing:3px}.layout{display:flex;align-items:center;flex:1;min-height:0;gap:30px}.copy{width:535px;flex-shrink:0;z-index:2;display:flex;flex-direction:column;gap:26px}.eyebrow{font-size:20px;letter-spacing:5px}.headline{font-size:72px;line-height:1.26;font-weight:900;letter-spacing:-3px;max-width:520px}.sub{font-size:24px;line-height:1.6}.rule{width:75px;height:5px;background:#492918;transform-origin:left}.photo{width:540px;height:490px;overflow:hidden;border-radius:210px 210px 16px 16px;flex-shrink:0;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.footer{display:flex;align-items:center;justify-content:space-between;font-size:16px;letter-spacing:2px;z-index:2}.circle{position:absolute;border:1px solid #E9B887;border-radius:50%;width:760px;height:760px;left:770px;top:-220px;pointer-events:none}.dot{position:absolute;border-radius:50%;background:#E9B887;width:140px;height:140px;left:515px;top:520px}.s2{opacity:0;z-index:2}.s2 .photo{border-radius:20px;width:440px;height:490px}.s2 .photo img{object-position:51% 46%;transform:scale(1.35)}.s2 .copy{width:605px;padding-left:25px}.s2 .headline{font-size:60px}.benefit{display:flex;gap:25px;align-items:center;font-size:37px;font-weight:700;border-bottom:1px solid #C7AD90;padding-bottom:16px}.num{font:italic 29px Georgia,serif;color:#806346}.benefits{display:flex;flex-direction:column;gap:23px}.s3{opacity:0;z-index:3;background:#492918;color:#F5EBDD}.s3 .photo{border-radius:250px;width:510px;height:465px}.s3 .brand-hero{font:125px Georgia,serif;letter-spacing:-6px}.s3 .headline{font-size:58px;letter-spacing:-1px}.s3 .copy{gap:16px}.cta{margin-top:8px;align-self:flex-start;border-radius:50px;padding:18px 28px;background:#E9B887;color:#492918;font-size:24px}.s3 .circle{border-color:#76513B;left:-280px;top:220px}.s3 .rule{background:#E9B887}
.s3 .brand-hero{font-size:92px;letter-spacing:-5px}.photo{border-radius:28px}</style></head><body>
<div id="root" data-composition-id="qing-ad" data-width="1280" data-height="720" data-start="0" data-duration="15">
<section id="s1" class="scene s1"><div class="circle" data-layout-ignore></div><div class="dot" data-layout-ignore></div><div class="scene-content">
<div class="top" data-layout-allow-overlap><div class="brand">MORNING / 早屿</div><div class="label">PRODUCT STORY</div></div>
<div class="layout"><div class="copy"><div class="eyebrow">新品，值得被看见</div><h1 class="headline"><span style="display:block">把早晨，</span><span style="display:block">慢慢唤醒。</span></h1><div class="rule"></div><div class="sub">精品咖啡豆 · 新品亮相</div></div><div class="photo" data-layout-allow-overflow><img src="assets/product1.png" alt="商品主图"></div></div>
<div class="footer"><span>A LITTLE MORE TO LOVE.</span><span>01 / 03</span></div></div></section>
<section id="s2" class="scene s2"><div class="circle" data-layout-ignore></div><div class="scene-content">
<div class="top" data-layout-allow-overlap><div class="brand">MORNING / 早屿</div><div class="label">MADE FOR YOUR EVERYDAY</div></div>
<div class="layout"><div class="photo" data-layout-allow-overflow><img src="assets/product2.png" alt="商品细节"></div><div class="copy"><h2 class="headline">精品咖啡豆</h2><div class="benefits"><div class="benefit"><span class="num">01</span><span>坚果香气</span></div><div class="benefit"><span class="num">02</span><span>巧克力风味</span></div><div class="benefit"><span class="num">03</span><span>醇厚口感</span></div></div></div></div>
<div class="footer"><span>从细节，发现更多喜欢。</span><span>02 / 03</span></div></div></section>
<section id="s3" class="scene s3"><div class="circle" data-layout-ignore></div><div class="scene-content">
<div class="top" data-layout-allow-overlap><div class="label">早屿 · 精品咖啡豆</div><div class="label">DISCOVER SOMETHING GOOD.</div></div>
<div class="layout"><div class="copy"><div class="brand-hero">MORNING</div><div class="rule"></div><h2 class="headline">从一杯好咖啡开始</h2><div class="cta">即刻了解 ↗</div></div><div class="photo" data-layout-allow-overflow><img src="assets/product3.png" alt="品牌商品收尾"></div></div>
<div class="footer"><span>商品展示 · 创意预览</span><span>03 / 03</span></div></div></section>
<audio id="music" src="assets/music.wav" data-start="0" data-duration="15" data-track-index="5" data-volume="0.7"></audio>
</div>
<script>
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});
function enter(scene,t){
tl.from(scene+' .top',{y:-18,opacity:0,duration:.5,ease:'power2.out'},t+.15);
tl.from(scene+' .photo',{scale:.93,rotation:-3,opacity:0,duration:.85,ease:'power3.out'},t+.18);
tl.from(scene+' .headline',{y:42,opacity:0,duration:.65,ease:'expo.out'},t+.28);
tl.from(scene+' .footer',{opacity:0,duration:.8,ease:'sine.out'},t+.55);
tl.from(scene+' .circle',{scale:.9,opacity:0,duration:.9,ease:'sine.out'},t+.1);
tl.to(scene+' .circle',{rotation:12,x:24,duration:4.5,ease:'sine.inOut'},t+.4);
}
enter('#s1',0);
tl.from('#s1 .eyebrow',{x:-25,opacity:0,duration:.4,ease:'power1.out'},.23);
tl.from('#s1 .sub',{y:20,opacity:0,duration:.55,ease:'power2.out'},.62);
tl.from('#s1 .rule',{scaleX:0,duration:.55,ease:'expo.out'},.55);
tl.from('#s1 .dot',{scale:0,opacity:0,duration:.9,ease:'back.out(1.2)'},.4);
tl.to('#s1 .dot',{y:-28,duration:3.6,ease:'sine.inOut'},1.3);
tl.to('#s1 .photo img',{scale:1.045,duration:4.2,ease:'sine.inOut'},.65);
tl.to('#s1',{opacity:0,duration:.5,ease:'power2.inOut'},4.8);
tl.fromTo('#s2',{opacity:0},{opacity:1,duration:.5,ease:'power2.inOut'},4.8);
enter('#s2',4.9);
tl.from('#s2 .benefit',{x:32,opacity:0,duration:.5,stagger:.18,ease:'power3.out'},5.65);
tl.to('#s2 .photo img',{x:15,duration:3.2,ease:'sine.inOut'},6);
tl.to('#s2',{opacity:0,duration:.55,ease:'power2.inOut'},9.8);
tl.fromTo('#s3',{opacity:0},{opacity:1,duration:.55,ease:'power2.inOut'},9.8);
enter('#s3',9.9);
tl.from('#s3 .brand-hero',{x:-36,opacity:0,duration:.75,ease:'power3.out'},10.1);
tl.from('#s3 .rule',{scaleX:0,duration:.6,ease:'expo.out'},10.4);
tl.from('#s3 .cta',{y:22,scale:.95,opacity:0,duration:.5,ease:'back.out(1.1)'},10.8);
tl.to('#s3 .photo img',{scale:1.04,duration:3.1,ease:'sine.inOut'},11.2);
window.__timelines['qing-ad']=tl;
</script></body></html>
